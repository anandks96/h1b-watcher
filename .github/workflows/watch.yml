name: H-1B slot watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slot-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check for new slots
        run: python watch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CONSULATES: ${{ vars.CONSULATES }}
          TYPES: ${{ vars.TYPES }}
          LATEST_DATE: ${{ vars.LATEST_DATE }}
          VISASLOTS: ${{ vars.VISASLOTS }}

      - name: Save state
        run: |
          if git diff --quiet -- state.json; then
            echo "Nothing new to save."
            exit 0
          fi
          git config user.name "slot-watcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update seen slots"
          for attempt in 1 2 3; do
            # Pick up anything committed since this run started (e.g. a file you uploaded).
            # If state.json changed both places, keep this run's copy: it's the newest.
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Save attempt $attempt failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Could not save state after 3 tries."
          exit 1
